name: Actualisation Data Meteo

on:
  schedule:
    - cron: '0 */6 * * *' # Se lance automatiquement toutes les 6 heures
  workflow_dispatch: # Permet de lancer la mise à jour manuellement via un bouton

permissions:
  contents: write # Autorise le robot à sauvegarder les JSON dans le dépôt

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Modifie si tu utilises une autre version

      - name: 📦 Installer les bibliothèques
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Lancer le Backend (Extraction & IA)
        run: python main_backend.py

      - name: 💾 Sauvegarder les nouveaux JSON sur GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Mise à jour auto des prévisions" && git push)