<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Météo & Océan</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-velocity/dist/leaflet-velocity.min.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet-velocity/dist/leaflet-velocity.min.js"></script>
    <style>
        /* Base Pro & Minimaliste */
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #0f172a; /* Bleu Nuit très profond */
            color: #f8fafc; 
            margin: 0; 
            padding: 30px 20px;
        }
        
        h1 { text-align: center; font-weight: 300; letter-spacing: 1px; color: #94a3b8; margin-bottom: 40px;}
        h2 { font-size: 1.2em; border-bottom: 1px solid #334155; padding-bottom: 10px; color: #cbd5e1; }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Style des Modules (Cartes) */
        .module {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        /* --- MODULE CARTE --- */
        #ma-carte { height: 400px; border-radius: 12px; margin-bottom: 15px; }
        
        /* --- MODULE WINDGURU PRO --- */
        .table-container {
            overflow-x: auto; /* Défilement horizontal fluide */
            border-radius: 8px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 800px; /* Force le défilement sur petit écran */
            font-size: 0.9em;
            text-align: center;
        }
        tr { border-bottom: 1px solid rgba(255,255,255,0.05); }
        th, td { padding: 12px; white-space: nowrap; }
        
        /* La colonne de gauche (Titres) reste figée quand on scrolle */
        .colonne-fixe {
            position: sticky;
            left: 0;
            background: #1e293b;
            text-align: right;
            font-weight: 600;
            color: #94a3b8;
            border-right: 2px solid #334155;
            z-index: 2;
        }

        /* Cellules de données avec bords arrondis intérieurs */
        td.data-cell {
            font-weight: 500;
            color: #1e293b; /* Texte foncé sur fond coloré pour la lisibilité */
            border-radius: 4px;
            border: 2px solid #1e293b; /* Crée un espace visuel entre les blocs de couleur */
        }

        /* --- STYLE PREMIUM POUR LES BOUTONS LEAFLET --- */
        /* 1. On enlève les bordures du conteneur global */
        .leaflet-bar {
            border: none !important;
            box-shadow: none !important;
        }

        /* 2. On unifie tous les boutons (+, -, GPS) */
        .leaflet-bar a, 
        .leaflet-bar a:hover, 
        #btn-gps {
            background-color: rgba(30, 41, 59, 0.7) !important; /* Bleu nuit transparent */
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important; /* Support Safari / iOS */
            color: #e2e8f0 !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
        }

        /* 3. On gère la vilaine ligne entre le + et le - */
        .leaflet-bar a:first-child {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
            border-top-left-radius: 8px !important;
            border-top-right-radius: 8px !important;
        }
        .leaflet-bar a:last-child {
            border-bottom-left-radius: 8px !important;
            border-bottom-right-radius: 8px !important;
        }

        /* 4. Le menu des calques (en haut à droite) */
        .leaflet-control-layers {
            background-color: rgba(30, 41, 59, 0.75) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 8px !important;
            color: #f8fafc !important; /* Texte blanc */
            box-shadow: 0 4px 6px rgba(0,0,0,0.3) !important;
        }

        /* 5. On blanchit l'icône noire du menu des calques */
        .leaflet-control-layers-toggle {
            filter: brightness(0) invert(1) opacity(0.9) !important;
        }
        .leaflet-control-zoom-in, .leaflet-control-zoom-out {
            filter: invert(100%);
        }
    </style>
</head>
<body>

    <h1>STATION CENTRALE</h1>
    
    <div class="dashboard-container">
        
        <div class="module">
            <h2>🌊 Cartographie Dynamique (Manche)</h2>
            <div id="ma-carte"></div>
            <!-- <input type="range" id="slider-temps" min="0" max="47" value="0" style="width:100%; cursor:pointer;"> -->
            <div style="text-align: center; color: #facc15; margin-top: 10px; font-weight: bold;" id="label-heure">
                Heure H+0
            </div>
        </div>
        
        <div id="barre-recherche" style="text-align: center; margin-bottom: 20px; padding: 10px;">
        <input type="text" id="input-ville" placeholder="Entrez une ville (ex: Biarritz)..." style="padding: 8px; width: 250px; border-radius: 5px; border: 1px solid #ccc;">
        <button id="btn-recherche" style="padding: 8px 15px; cursor: pointer; border-radius: 5px; border: none; background-color: #007BFF; color: white;">Chercher</button>
        </div>

        <div class="module">
            <h2 id="titre-tableau">📍 Prévisions Locales</h2>
            <div class="table-container">
                <table>
                    <tbody id="windguru-body">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
